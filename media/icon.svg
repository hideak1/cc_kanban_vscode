  <rect x="28" y="24" width="22" height="80" rx="7" fill="#4a90e2"/>
  <rect x="58" y="24" width="40" height="34" rx="9" fill="#f2a33a" transform="rotate(-18 78 41)"/>
  <rect x="58" y="70" width="40" height="34" rx="9" fill="#5cc28a" transform="rotate(18 78 87)"/>
</svg>
